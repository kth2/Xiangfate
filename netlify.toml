[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA 回退。
#
# ⚠️ 这条规则**只写在这里**，不要再放一份 public/_redirects。
# Cloudflare Workers 的静态资源服务会把 /index.html 规范化成 /，
# 于是 `/*  /index.html  200` 会再次匹配 /* —— Cloudflare 直接判定为
# 无限循环并拒绝部署（错误码 100324）。
# Cloudflare 那边由 wrangler 的 not_found_handling = "single-page-application"
# 负责，Vercel 由 vercel.json 的 rewrites 负责，三家各管各的。
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 指纹化的静态资源可以长缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mediapipe/wasm/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker 必须每次校验，否则更新推不下去
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), interest-cohort=()"
